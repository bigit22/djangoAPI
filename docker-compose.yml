services:
  web:
    build: .
    ports: 
    - '5000:5000'
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///db.sqlite3
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - .:/app

  redis:
    image: 'redis:alpine'
    ports:
      - '6379:6379'